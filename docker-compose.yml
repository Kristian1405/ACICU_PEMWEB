services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
      # Kredensial server Firebase (Service Account). Letakkan file JSON di
      # folder host ./storage/app/firebase/ agar otomatis tersedia di container.
      # File *.json di folder ini di-ignore Git dan Docker (.dockerignore).
      - ./storage/app/firebase:/var/www/html/storage/app/firebase
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - workspace_vendor:/workspace/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /workspace/database/database.sqlite
    command: tail -f /dev/null
    profiles: ["workspace"]

volumes:
  app_storage:
  app_database:
  workspace_node_modules:
  workspace_vendor:
